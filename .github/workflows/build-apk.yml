name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the ios branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JavaScript dependencies
        run: |
          corepack enable || true
          yarn install --immutable || yarn install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;23.1.7779620"

      - name: Prepare release signing (project debug key)
        run: cp android/app/debug.keystore android/app/xstreaming-release-key.keystore

      - name: Build the release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PXSTREAMING_RELEASE_STORE_PASSWORD=android \
            -PXSTREAMING_RELEASE_KEY_ALIAS=androiddebugkey \
            -PXSTREAMING_RELEASE_KEY_PASSWORD=android

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: XStreaming-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
